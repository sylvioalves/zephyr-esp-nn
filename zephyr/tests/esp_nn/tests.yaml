common:
  tags: esp_nn
  filter: CONFIG_FULL_LIBC_SUPPORTED
  platform_allow:
    - esp32c3_devkitm
    - esp32s3_devkitc/esp32s3/procpu
    - esp32s3_eye/esp32s3/procpu
  integration_platforms:
    - esp32s3_devkitc/esp32s3/procpu
  harness: ztest
tests:
  libraries.esp_nn:
    extra_configs:
      - CONFIG_ESP_NN_OPTIMIZED=y
  libraries.esp_nn.ansi:
    extra_configs:
      - CONFIG_ESP_NN_ANSI_C=y
